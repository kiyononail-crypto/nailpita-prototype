<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネイルピタ — プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose-50:#F4EAEA;
    --rose-100:#E8D4D6;
    --rose-400:#C9A0A5;
    --rose-600:#A97D82;
    --rose-800:#5C333A;
    --rose-900:#4A282D;
    --cream:#FAF6F3;
    --ink:#33282A;
    --muted:#8A7476;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.7;
  }
  h1,h2,h3{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    margin:0;
  }
  .wrap{max-width:480px; margin:0 auto; padding:0 20px 80px;}
  header{
    padding:40px 20px 28px;
    text-align:center;
    border-bottom:1px solid var(--rose-100);
  }
  header .eyebrow{
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--rose-600);
    margin-bottom:8px;
  }
  header h1{font-size:30px; color:var(--rose-900);}
  header p{font-size:13px; color:var(--muted); margin-top:8px;}

  .guide{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--rose-50);
    border-radius:14px;
    padding:14px 16px;
    margin:24px 0;
  }
  .guide svg{width:40px; height:40px; flex-shrink:0;}
  .guide p{font-size:13px; color:var(--rose-900); margin:0;}

  section.step{margin-top:12px; display:none;}
  section.step.show{display:block;}
  section.step h2{font-size:16px; color:var(--rose-900); margin-bottom:14px;}

  .color-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;
  }
  .color-btn{
    border:1px solid var(--rose-100);
    border-radius:14px;
    padding:14px 6px 10px;
    background:#fff;
    text-align:center;
    cursor:pointer;
    font-family:inherit;
  }
  .color-btn .swatch-dot{
    width:36px; height:36px; border-radius:50%;
    margin:0 auto 8px;
    border:1px solid rgba(0,0,0,0.08);
  }
  .color-btn span{font-size:12px; color:var(--ink);}
  .color-btn:active{background:var(--rose-50);}

  .chip-row{display:flex; flex-wrap:wrap; gap:10px;}
  .chip-btn{
    border:1px solid var(--rose-600);
    border-radius:999px;
    padding:9px 16px;
    background:#fff;
    color:var(--rose-800);
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .chip-btn.skip{border-style:dashed; color:var(--muted); border-color:var(--muted);}

  .selection-summary{
    font-size:12px; color:var(--muted); margin-bottom:14px;
  }
  .selection-summary b{color:var(--rose-800);}

  .product-card{
    display:flex; gap:12px; align-items:center;
    background:#fff;
    border:1px solid var(--rose-100);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:12px;
  }
  .product-swatch{width:44px; height:44px; border-radius:8px; flex-shrink:0; border:1px solid rgba(0,0,0,0.06);}
  .product-info{flex:1; min-width:0;}
  .product-info .name{font-size:13px; margin:0 0 2px; color:var(--ink);}
  .product-info .meta{font-size:12px; color:var(--muted); margin:0;}
  .match-pill{
    font-size:11px; font-weight:500;
    background:var(--rose-100); color:var(--rose-800);
    border-radius:8px; padding:2px 8px; white-space:nowrap;
  }
  .product-card a.buy{
    font-size:12px; font-weight:500;
    color:var(--rose-800);
    border:1px solid var(--rose-600);
    border-radius:8px;
    padding:6px 10px;
    text-decoration:none;
    white-space:nowrap;
  }
  .rank-badge{
    font-size:11px; color:var(--rose-600); font-weight:700; width:20px; flex-shrink:0;
  }
  .action-row{display:flex; gap:10px; margin-top:16px;}
  .action-row button{flex:1;}
  button{
    font-family:inherit; font-size:13px;
    border:1px solid var(--rose-600); border-radius:10px;
    background:#fff; color:var(--rose-800); padding:10px; cursor:pointer;
  }
  .empty-msg{font-size:13px; color:var(--muted); padding:12px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">NAIL PITA PROTOTYPE</div>
    <h1>ネイルピタ</h1>
    <p>色とお好みを選ぶだけで、ぴったりのジェルカラーが見つかる</p>
    <p id="dataSourceBadge" style="font-size:11px; color:var(--rose-600); margin-top:6px;"></p>
  </header>

  <div class="guide">
    <svg viewBox="0 0 100 100" role="img"><title>ネイリストキャラクター</title>
      <path d="M60 35 Q90 42 88 75 Q84 95 74 92 Q82 68 70 48 Q68 60 60 62Z" fill="#8B5E45"/>
      <path d="M64 45 Q86 55 82 82 Q80 96 72 90 Q78 70 66 55Z" fill="#7A4F39"/>
      <rect x="66" y="40" width="7" height="6" rx="2" fill="#EDE0CC"/>
      <rect x="70" y="58" width="6" height="5" rx="2" fill="#EDE0CC"/>
      <circle cx="50" cy="40" r="27" fill="#FCE4D6"/>
      <path d="M23 38 Q25 8 50 10 Q75 8 74 36 Q64 20 50 20 Q36 20 23 38Z" fill="#8B5E45"/>
      <path d="M23 36 Q17 55 27 70 Q24 52 32 40Z" fill="#8B5E45"/>
      <circle cx="41" cy="42" r="3.2" fill="#3C2C24"/>
      <circle cx="59" cy="42" r="3.2" fill="#3C2C24"/>
      <circle cx="31" cy="50" r="6" fill="#E8A3AE" opacity="0.6"/>
      <circle cx="69" cy="50" r="6" fill="#E8A3AE" opacity="0.6"/>
      <path d="M42 54 Q50 60 58 54" fill="none" stroke="#3C2C24" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 78 Q50 62 82 78 L86 100 L14 100Z" fill="#E8DCC8"/>
      <path d="M33 78 Q50 68 67 78 L69 87 Q50 79 31 87Z" fill="#C9A0A5"/>
      <rect x="42" y="90" width="16" height="10" rx="3" fill="#E8D4D6"/>
    </svg>
    <p id="guideText">まずは気になる色の系統を選んでね!</p>
  </div>

  <!-- ① 色系統の選択 -->
  <section class="step show" id="stepColor">
    <h2>①どの色系統が気になる?</h2>
    <div class="color-grid" id="colorGrid"></div>
  </section>

  <!-- ② 質感の選択 -->
  <section class="step" id="stepFinish">
    <h2>②お好みの質感は?</h2>
    <div class="selection-summary" id="colorSummary"></div>
    <div class="chip-row" id="finishChips"></div>
  </section>

  <!-- ③ ジェルカラーの結果 -->
  <section class="step" id="stepResults">
    <h2>人気のジェルカラー</h2>
    <div class="selection-summary" id="resultSummary"></div>
    <div id="productList"></div>
    <div class="action-row">
      <button id="moreColorsBtn">気に入らない場合→次の5件</button>
    </div>
    <div class="action-row">
      <button id="retryBtn">🔄 最初からやり直す</button>
    </div>
  </section>

  <!-- ③' ネイルアート/パーツを見るか -->
  <section class="step" id="stepArtPrompt">
    <h2>ネイルアートもしてみる?</h2>
    <div class="action-row">
      <button id="wantPartsBtn">する(パーツを見る)</button>
      <button id="skipPartsBtn" class="skip">しない</button>
    </div>
  </section>

  <!-- ④ パーツの結果 -->
  <section class="step" id="stepParts">
    <h2>人気のネイルパーツ</h2>
    <div id="partsList"></div>
    <div class="action-row">
      <button id="morePartsBtn">気に入らない場合→次の5件</button>
    </div>
    <div class="action-row">
      <button id="retryBtn2">🔄 最初からやり直す</button>
    </div>
  </section>
</div>

<script>
// --- 色系統(色相ベース)の一覧。ボタンの色はイメージ用のサンプルカラー ---
const COLOR_FAMILIES = [
  { key: 'レッド', swatch: '#D64545' },
  { key: 'ピンク', swatch: '#E38AA0' },
  { key: 'オレンジ', swatch: '#E08A4B' },
  { key: 'イエロー', swatch: '#E8C84B' },
  { key: 'グリーン/イエローグリーン', swatch: '#8FBF6B', label: 'グリーン' },
  { key: 'ブルー/ライトブルー', swatch: '#5B8FD1', label: 'ブルー' },
  { key: 'パープル', swatch: '#9B7FC7' },
  { key: 'ブラウン', swatch: '#8B5E3C' },
  { key: 'グレー', swatch: '#A8A8A0' },
  { key: 'ブラック', swatch: '#333333' },
  { key: 'ホワイト', swatch: '#F7F3EC' },
];

const FINISH_TYPES = ['マット', 'シアー', 'クリア', 'グリッター', 'マグネット', 'メタリック'];

// --- サンプル商品DB(products.jsonが読み込めない場合のフォールバック) ---
const sampleProducts = [
  {name:"ジェルカラー ヌーディーベージュ", hexColor:"#D9B79C", price:380, aspSource:"楽天", affiliateUrl:"#", isColorProduct:true, colorFamily:"ブラウン", finishTypes:[], reviewCount:120},
  {name:"ジェルカラー ミルクティー", hexColor:"#C9A98B", price:420, aspSource:"楽天", affiliateUrl:"#", isColorProduct:true, colorFamily:"ブラウン", finishTypes:['シアー'], reviewCount:98},
  {name:"ジェルカラー グレージュ", hexColor:"#B7A99C", price:450, aspSource:"Amazon", affiliateUrl:"#", isColorProduct:true, colorFamily:"グレー", finishTypes:[], reviewCount:76},
  {name:"ジェルカラー くすみピンク", hexColor:"#C9A0A5", price:390, aspSource:"ネイル専門通販", affiliateUrl:"#", isColorProduct:true, colorFamily:"ピンク", finishTypes:['マット'], reviewCount:210},
  {name:"ジェルカラー サーモンオレンジ", hexColor:"#E29C7C", price:410, aspSource:"楽天", affiliateUrl:"#", isColorProduct:true, colorFamily:"オレンジ", finishTypes:[], reviewCount:65},
  {name:"ジェルカラー コーラルレッド", hexColor:"#D85A45", price:480, aspSource:"Amazon", affiliateUrl:"#", isColorProduct:true, colorFamily:"レッド", finishTypes:['グリッター'], reviewCount:143},
  {name:"ジェルカラー ボルドー", hexColor:"#7A3540", price:520, aspSource:"ネイル専門通販", affiliateUrl:"#", isColorProduct:true, colorFamily:"レッド", finishTypes:['マット'], reviewCount:87},
  {name:"ジェルカラー ラベンダーグレー", hexColor:"#A8A0B8", price:400, aspSource:"楽天", affiliateUrl:"#", isColorProduct:true, colorFamily:"パープル", finishTypes:[], reviewCount:54},
  {name:"ジェルカラー ミントグレー", hexColor:"#9EB8AE", price:400, aspSource:"Amazon", affiliateUrl:"#", isColorProduct:true, colorFamily:"グリーン/イエローグリーン", finishTypes:['シアー'], reviewCount:61},
  {name:"ジェルカラー ミルキーホワイト", hexColor:"#EDE6DD", price:360, aspSource:"楽天", affiliateUrl:"#", isColorProduct:true, colorFamily:"ホワイト", finishTypes:[], reviewCount:132},
  {name:"ジェルカラー チョコレートブラウン", hexColor:"#5A3C2E", price:430, aspSource:"ネイル専門通販", affiliateUrl:"#", isColorProduct:true, colorFamily:"ブラウン", finishTypes:['マット'], reviewCount:70},
  {name:"ジェルカラー スモーキーネイビー", hexColor:"#3E4652", price:470, aspSource:"Amazon", affiliateUrl:"#", isColorProduct:true, colorFamily:"ブルー/ライトブルー", finishTypes:['メタリック'], reviewCount:58},
];
const samplePartsProducts = [
  {name:"ネイルパーツ ミックスストーン", hexColor:"#D9C9CC", price:480, aspSource:"楽天", affiliateUrl:"#", isPartsProduct:true, quantity:10, reviewCount:120},
  {name:"ネイルパーツ パールセット", hexColor:"#EDE6DD", price:390, aspSource:"楽天", affiliateUrl:"#", isPartsProduct:true, quantity:10, reviewCount:88},
  {name:"ネイルパーツ ゴールドスタッズ", hexColor:"#C9A45A", price:520, aspSource:"Amazon", affiliateUrl:"#", isPartsProduct:true, quantity:8, reviewCount:64},
];

let allProducts = sampleProducts.concat(samplePartsProducts);
let usingLiveData = false;

async function loadProducts(){
  try{
    const res = await fetch('products.json', {cache: 'no-store'});
    if(!res.ok) throw new Error('products.json not reachable');
    const data = await res.json();
    if(Array.isArray(data) && data.length > 0){
      allProducts = data;
      usingLiveData = true;
    }
  }catch(err){
    console.warn('products.jsonを読み込めなかったため、サンプルデータを使用します:', err.message);
  }
  const badge = document.getElementById('dataSourceBadge');
  if(badge){
    badge.textContent = usingLiveData ? '楽天の実データを表示中' : 'サンプルデータを表示中(products.jsonが見つかりません)';
  }
}
loadProducts();

// --- 状態管理 ---
let selectedColor = null;
let selectedFinish = null;
let colorPage = 0;   // 0=1〜5件目, 1=6〜10件目 ...
let partsPage = 0;

function showStep(id){
  document.querySelectorAll('section.step').forEach(s => s.classList.remove('show'));
  document.getElementById(id).classList.add('show');
  document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
}

// --- ①色系統ボタンの描画 ---
const colorGrid = document.getElementById('colorGrid');
COLOR_FAMILIES.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'color-btn';
  btn.innerHTML = `<div class="swatch-dot" style="background:${c.swatch}"></div><span>${c.label || c.key}</span>`;
  btn.addEventListener('click', () => {
    selectedColor = c.key;
    document.getElementById('colorSummary').innerHTML = `選んだ色系統:<b>${c.label || c.key}</b>`;
    document.getElementById('guideText').textContent = '質感のお好みも教えてね!';
    showStep('stepFinish');
  });
  colorGrid.appendChild(btn);
});

// --- ②質感チップの描画 ---
const finishChips = document.getElementById('finishChips');
FINISH_TYPES.forEach(f => {
  const btn = document.createElement('button');
  btn.className = 'chip-btn';
  btn.textContent = f;
  btn.addEventListener('click', () => {
    selectedFinish = f;
    startColorSearch();
  });
  finishChips.appendChild(btn);
});
const skipChip = document.createElement('button');
skipChip.className = 'chip-btn skip';
skipChip.textContent = 'こだわらない';
skipChip.addEventListener('click', () => {
  selectedFinish = null;
  startColorSearch();
});
finishChips.appendChild(skipChip);

// --- 人気順(レビュー件数)でのランキング表示 ---
function getRankedColors(){
  return allProducts
    .filter(p => p.isColorProduct && p.colorFamily === selectedColor && (!selectedFinish || (p.finishTypes || []).includes(selectedFinish)))
    .sort((a, b) => (b.reviewCount || 0) - (a.reviewCount || 0));
}

function startColorSearch(){
  colorPage = 0;
  document.getElementById('resultSummary').innerHTML =
    `色系統:<b>${selectedColor}</b>　質感:<b>${selectedFinish || 'こだわらない'}</b>`;
  renderColorPage();
  document.getElementById('guideText').textContent = '人気のジェルカラーはこちら!気に入らなければ次の候補も見られるよ';
  showStep('stepResults');
}

function renderColorPage(){
  const ranked = getRankedColors();
  const start = colorPage * 5;
  const pageItems = ranked.slice(start, start + 5);
  const list = document.getElementById('productList');
  list.innerHTML = '';

  if(pageItems.length === 0){
    list.innerHTML = `<p class="empty-msg">${start === 0 ? 'この組み合わせの商品がまだ見つかりませんでした。質感を変えて試してみてください。' : 'これ以上の候補はありません。'}</p>`;
    document.getElementById('moreColorsBtn').disabled = true;
    return;
  }
  document.getElementById('moreColorsBtn').disabled = (start + 5) >= ranked.length;

  pageItems.forEach((p, i) => {
    const isRealLink = usingLiveData && p.affiliateUrl && p.affiliateUrl !== '#';
    const finishBadges = (p.finishTypes || []).map(f => `<span class="match-pill">${f}</span>`).join('');
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="rank-badge">${start + i + 1}</div>
      <div class="product-swatch" style="background:${p.hexColor}"></div>
      <div class="product-info">
        <p class="name">${p.name}</p>
        <p class="meta">¥${p.price} ・ ${p.aspSource} ${finishBadges}</p>
      </div>
      ${isRealLink
        ? `<a class="buy" href="${p.affiliateUrl}" target="_blank" rel="noopener">商品を見る</a>`
        : `<a class="buy" href="#" onclick="alert('サンプルのため実際のリンク先はありません。'); return false;">商品を見る</a>`
      }
    `;
    list.appendChild(card);
  });
}

document.getElementById('moreColorsBtn').addEventListener('click', () => {
  colorPage += 1;
  renderColorPage();
  document.getElementById('guideText').textContent = `次の候補を見てみよう(${colorPage * 5 + 1}〜${colorPage * 5 + 5}位)`;
});

function goToArtPrompt(){
  showStep('stepArtPrompt');
  document.getElementById('guideText').textContent = 'ネイルアートやパーツも見てみる?';
}

// 色の結果を見たら、アートの案内に進めるボタンを追加する
(function addArtPromptButton(){
  const section = document.getElementById('stepResults');
  const btn = document.createElement('button');
  btn.textContent = 'ネイルアートも見てみる';
  btn.style.width = '100%';
  btn.style.marginTop = '10px';
  btn.addEventListener('click', goToArtPrompt);
  section.appendChild(btn);
})();

document.getElementById('wantPartsBtn').addEventListener('click', () => {
  partsPage = 0;
  renderPartsPage();
  document.getElementById('guideText').textContent = '人気のパーツはこちら!';
  showStep('stepParts');
});
document.getElementById('skipPartsBtn').addEventListener('click', () => {
  document.getElementById('guideText').textContent = 'また色を選び直したくなったらいつでもどうぞ!';
});

function partsSortScore(p){
  // 10個以下を優先しつつ、人気順(レビュー数)も考慮する
  const qtyScore = p.quantity == null ? 500 : (p.quantity <= 10 ? (10 - p.quantity) * 10 : 100 + p.quantity);
  return qtyScore - (p.reviewCount || 0) / 100;
}

function getRankedParts(){
  return allProducts
    .filter(p => p.isPartsProduct)
    .sort((a, b) => partsSortScore(a) - partsSortScore(b));
}

function renderPartsPage(){
  const ranked = getRankedParts();
  const start = partsPage * 5;
  const pageItems = ranked.slice(start, start + 5);
  const list = document.getElementById('partsList');
  list.innerHTML = '';

  if(pageItems.length === 0){
    list.innerHTML = `<p class="empty-msg">${start === 0 ? 'パーツの商品がまだ見つかりませんでした。' : 'これ以上の候補はありません。'}</p>`;
    document.getElementById('morePartsBtn').disabled = true;
    return;
  }
  document.getElementById('morePartsBtn').disabled = (start + 5) >= ranked.length;

  pageItems.forEach((p, i) => {
    const isRealLink = usingLiveData && p.affiliateUrl && p.affiliateUrl !== '#';
    const qtyLabel = p.quantity ? `${p.quantity}個入り` : '個数記載なし';
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="rank-badge">${start + i + 1}</div>
      <div class="product-swatch" style="background:${p.hexColor || '#E8D4D6'}"></div>
      <div class="product-info">
        <p class="name">${p.name}</p>
        <p class="meta">¥${p.price} ・ ${p.aspSource} <span class="match-pill">${qtyLabel}</span></p>
      </div>
      ${isRealLink
        ? `<a class="buy" href="${p.affiliateUrl}" target="_blank" rel="noopener">商品を見る</a>`
        : `<a class="buy" href="#" onclick="alert('サンプルのため実際のリンク先はありません。'); return false;">商品を見る</a>`
      }
    `;
    list.appendChild(card);
  });
}

document.getElementById('morePartsBtn').addEventListener('click', () => {
  partsPage += 1;
  renderPartsPage();
});

function resetAll(){
  selectedColor = null;
  selectedFinish = null;
  colorPage = 0;
  partsPage = 0;
  document.getElementById('guideText').textContent = 'まずは気になる色の系統を選んでね!';
  showStep('stepColor');
}
document.getElementById('retryBtn').addEventListener('click', resetAll);
document.getElementById('retryBtn2').addEventListener('click', resetAll);
</script>
</body>
</html>
