<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネイルピタ — プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose-50:#F4EAEA;
    --rose-100:#E8D4D6;
    --rose-400:#C9A0A5;
    --rose-600:#A97D82;
    --rose-800:#5C333A;
    --rose-900:#4A282D;
    --cream:#FAF6F3;
    --ink:#33282A;
    --muted:#8A7476;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.7;
  }
  h1,h2,h3{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    margin:0;
  }
  .wrap{max-width:480px; margin:0 auto; padding:0 20px 80px;}
  header{
    padding:40px 20px 28px;
    text-align:center;
    border-bottom:1px solid var(--rose-100);
  }
  header .eyebrow{
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--rose-600);
    margin-bottom:8px;
  }
  header h1{font-size:30px; color:var(--rose-900);}
  header p{font-size:13px; color:var(--muted); margin-top:8px;}

  .guide{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--rose-50);
    border-radius:14px;
    padding:14px 16px;
    margin:24px 0;
  }
  .guide img{width:44px; height:44px; flex-shrink:0;}
  .guide p{font-size:13px; color:var(--rose-900); margin:0;}

  section.step{margin-top:12px; display:none;}
  section.step.show{display:block;}
  section.step h2{font-size:16px; color:var(--rose-900); margin-bottom:14px;}

  .color-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;
  }
  .color-btn{
    border:1px solid var(--rose-100);
    border-radius:14px;
    padding:14px 6px 10px;
    background:#fff;
    text-align:center;
    cursor:pointer;
    font-family:inherit;
  }
  .color-btn .swatch-dot{
    width:36px; height:36px; border-radius:50%;
    margin:0 auto 8px;
    border:1px solid rgba(0,0,0,0.08);
  }
  .color-btn span{font-size:12px; color:var(--ink);}
  .color-btn:active{background:var(--rose-50);}

  .chip-row{display:flex; flex-wrap:wrap; gap:10px;}
  .chip-btn{
    border:1px solid var(--rose-600);
    border-radius:999px;
    padding:9px 16px;
    background:#fff;
    color:var(--rose-800);
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .chip-btn.skip{border-style:dashed; color:var(--muted); border-color:var(--muted);}

  .selection-summary{
    font-size:12px; color:var(--muted); margin-bottom:14px;
  }
  .selection-summary b{color:var(--rose-800);}

  .product-card{
    display:flex; gap:12px; align-items:center;
    background:#fff;
    border:1px solid var(--rose-100);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:12px;
  }
  .product-swatch{width:44px; height:44px; border-radius:8px; flex-shrink:0; border:1px solid rgba(0,0,0,0.06);}
  .product-info{flex:1; min-width:0;}
  .product-info .name{font-size:13px; margin:0 0 2px; color:var(--ink);}
  .product-info .meta{font-size:12px; color:var(--muted); margin:0;}
  .match-pill{
    font-size:11px; font-weight:500;
    background:var(--rose-100); color:var(--rose-800);
    border-radius:8px; padding:2px 8px; white-space:nowrap;
  }
  .product-card a.buy{
    font-size:12px; font-weight:500;
    color:var(--rose-800);
    border:1px solid var(--rose-600);
    border-radius:8px;
    padding:6px 10px;
    text-decoration:none;
    white-space:nowrap;
  }
  .rank-badge{
    font-size:11px; color:var(--rose-600); font-weight:700; width:20px; flex-shrink:0;
  }
  .action-row{display:flex; gap:10px; margin-top:16px;}
  .action-row button{flex:1;}
  button{
    font-family:inherit; font-size:13px;
    border:1px solid var(--rose-600); border-radius:10px;
    background:#fff; color:var(--rose-800); padding:10px; cursor:pointer;
  }
  .product-card.selected{border-color:var(--rose-600); background:var(--rose-50);}
  .select-btn{
    font-size:12px; font-weight:500;
    border:1px solid var(--rose-600); border-radius:8px;
    padding:6px 10px; background:#fff; color:var(--rose-800);
    white-space:nowrap; cursor:pointer;
  }
  .select-btn.active{background:var(--rose-600); color:#fff;}
  .empty-msg{font-size:13px; color:var(--muted); padding:12px 0;}
</style>
</head>

// --- ①色系統ボタンの描画 ---
const colorGrid = document.getElementById('colorGrid');
COLOR_FAMILIES.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'color-btn';
  btn.innerHTML = `<div class="swatch-dot" style="background:${c.swatch}"></div><span>${c.label || c.key}</span>`;
  btn.addEventListener('click', () => {
    selectedColor = c.key;
    selectedFinish = null;
    startColorSearch();
  });
  colorGrid.appendChild(btn);
});

// --- 質感チップの描画(結果画面内の絞り込みフィルターとして機能) ---
const finishChips = document.getElementById('finishChips');
function renderFinishChips(){
  finishChips.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip-btn' + (selectedFinish === null ? '' : ' skip');
  allChip.textContent = 'すべて';
  allChip.addEventListener('click', () => {
    selectedFinish = null;
    colorPage = 0;
    updateResultSummary();
    renderColorPage();
  });
  finishChips.appendChild(allChip);

  FINISH_TYPES.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'chip-btn';
    btn.textContent = f;
    if(selectedFinish === f) btn.style.background = 'var(--rose-100)';
    btn.addEventListener('click', () => {
      selectedFinish = f;
      colorPage = 0;
      updateResultSummary();
      renderColorPage();
      renderFinishChips();
    });
    finishChips.appendChild(btn);
  });
}

function updateResultSummary(){
  document.getElementById('resultSummary').innerHTML =
    `色系統:<b>${selectedColor}</b>　質感:<b>${selectedFinish || 'こだわらない'}</b>`;
}

// --- 人気順(レビュー件数)でのランキング表示 ---
function getRankedColors(){
  return allProducts
    .filter(p => p.isColorProduct && p.colorFamily === selectedColor && (!selectedFinish || (p.finishTypes || []).includes(selectedFinish)))
    .sort((a, b) => (b.reviewCount || 0) - (a.reviewCount || 0));
}

function startColorSearch(){
  colorPage = 0;
  updateResultSummary();
  renderFinishChips();
  renderColorPage();
  document.getElementById('guideText').textContent = '人気のジェルカラーはこちら!気に入らなければ次の候補も見られるよ';
  showStep('stepResults');
}

function renderColorPage(){
  const ranked = getRankedColors();
  const start = colorPage * 5;
  const pageItems = ranked.slice(start, start + 5);
  const list = document.getElementById('productList');
  list.innerHTML = '';

  if(pageItems.length === 0){
    list.innerHTML = `<p class="empty-msg">${start === 0 ? 'この組み合わせの商品がまだ見つかりませんでした。質感を変えて試してみてください。' : 'これ以上の候補はありません。'}</p>`;
    document.getElementById('moreColorsBtn').disabled = true;
    return;
  }
  document.getElementById('moreColorsBtn').disabled = (start + 5) >= ranked.length;

  pageItems.forEach((p, i) => {
    const isRealLink = usingLiveData && p.affiliateUrl && p.affiliateUrl !== '#';
    const finishBadges = (p.finishTypes || []).map(f => `<span class="match-pill">${f}</span>`).join('');
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="rank-badge">${start + i + 1}</div>
      <div class="product-swatch" style="background:${p.hexColor}"></div>
      <div class="product-info">
        <p class="name">${p.name}</p>
        <p class="meta">¥${p.price} ・ ${p.aspSource} ${finishBadges}</p>
      </div>
      ${isRealLink
        ? `<a class="buy" href="${p.affiliateUrl}" target="_blank" rel="noopener">商品を見る</a>`
        : `<a class="buy" href="#" onclick="alert('サンプルのため実際のリンク先はありません。'); return false;">商品を見る</a>`
      }
    `;
    list.appendChild(card);
  });
}

document.getElementById('moreColorsBtn').addEventListener('click', () => {
  colorPage += 1;
  renderColorPage();
  document.getElementById('guideText').textContent = `次の候補を見てみよう(${colorPage * 5 + 1}〜${colorPage * 5 + 5}位)`;
});

function goToArtPrompt(){
  showStep('stepArtPrompt');
  document.getElementById('guideText').textContent = 'ネイルアートやパーツも見てみる?';
}

// 色の結果を見たら、アートの案内に進めるボタンを追加する
(function addArtPromptButton(){
  const section = document.getElementById('stepResults');
  const btn = document.createElement('button');
  btn.textContent = 'ネイルアートも見てみる';
  btn.style.width = '100%';
  btn.style.marginTop = '10px';
  btn.addEventListener('click', goToArtPrompt);
  section.appendChild(btn);
})();

document.getElementById('wantPartsBtn').addEventListener('click', () => {
  partsPage = 0;
  renderPartsPage();
  const family = COLOR_FAMILIES.find(c => c.key === selectedColor);
  const summary = document.getElementById('chosenColorSummary');
  if(family && summary){
    summary.innerHTML = `<span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:${family.swatch}; vertical-align:-2px; margin-right:6px; border:1px solid rgba(0,0,0,0.1);"></span>選んだ色系統:<b>${family.label || family.key}</b> と合わせるパーツ`;
  }
  document.getElementById('guideText').textContent = '人気のパーツはこちら!';
  showStep('stepParts');
});
document.getElementById('skipPartsBtn').addEventListener('click', () => {
  document.getElementById('guideText').textContent = 'また色を選び直したくなったらいつでもどうぞ!';
});

function partsSortScore(p){
  // 10個以下を優先しつつ、人気順(レビュー数)も考慮する
  const qtyScore = p.quantity == null ? 500 : (p.quantity <= 10 ? (10 - p.quantity) * 10 : 100 + p.quantity);
  return qtyScore - (p.reviewCount || 0) / 100;
}

function getRankedParts(){
  return allProducts
    .filter(p => p.isPartsProduct)
    .sort((a, b) => partsSortScore(a) - partsSortScore(b));
}

let selectedPartsIds = new Set();

function partKeyOf(p){
  return p.productId || p.name;
}

function updatePartsSelectedCount(){
  const el = document.getElementById('partsSelectedCount');
  if(el) el.innerHTML = selectedPartsIds.size > 0 ? `<b>${selectedPartsIds.size}件</b>選択中` : '気になるパーツをいくつでも選んでね';
}

function renderPartsPage(){
  const ranked = getRankedParts();
  const start = partsPage * 5;
  const pageItems = ranked.slice(start, start + 5);
  const list = document.getElementById('partsList');
  list.innerHTML = '';

  if(pageItems.length === 0){
    list.innerHTML = `<p class="empty-msg">${start === 0 ? 'パーツの商品がまだ見つかりませんでした。' : 'これ以上の候補はありません。'}</p>`;
    document.getElementById('morePartsBtn').disabled = true;
    updatePartsSelectedCount();
    return;
  }
  document.getElementById('morePartsBtn').disabled = (start + 5) >= ranked.length;

  pageItems.forEach((p, i) => {
    const key = partKeyOf(p);
    const isSelected = selectedPartsIds.has(key);
    const isRealLink = usingLiveData && p.affiliateUrl && p.affiliateUrl !== '#';
    const qtyLabel = p.quantity ? `${p.quantity}個入り` : '個数記載なし';
    const card = document.createElement('div');
    card.className = 'product-card' + (isSelected ? ' selected' : '');
    card.innerHTML = `
      <div class="rank-badge">${start + i + 1}</div>
      <div class="product-swatch" style="background:${p.hexColor || '#E8D4D6'}"></div>
      <div class="product-info">
        <p class="name">${p.name}</p>
        <p class="meta">¥${p.price} ・ ${p.aspSource} <span class="match-pill">${qtyLabel}</span></p>
      </div>
      <button class="select-btn${isSelected ? ' active' : ''}" data-key="${key}">${isSelected ? '選択中✓' : '選ぶ'}</button>
      ${isRealLink
        ? `<a class="buy" href="${p.affiliateUrl}" target="_blank" rel="noopener">商品を見る</a>`
        : `<a class="buy" href="#" onclick="alert('サンプルのため実際のリンク先はありません。'); return false;">商品を見る</a>`
      }
    `;
    card.querySelector('.select-btn').addEventListener('click', () => {
      if(selectedPartsIds.has(key)) selectedPartsIds.delete(key);
      else selectedPartsIds.add(key);
      renderPartsPage();
    });
    list.appendChild(card);
  });
  updatePartsSelectedCount();
}

document.getElementById('morePartsBtn').addEventListener('click', () => {
  partsPage += 1;
  renderPartsPage();
});

document.getElementById('backToColorsBtn').addEventListener('click', () => {
  showStep('stepResults');
  document.getElementById('guideText').textContent = '色をまた見てみよう!';
});
document.getElementById('backToColorsBtn2').addEventListener('click', () => {
  showStep('stepResults');
  document.getElementById('guideText').textContent = '色をまた見てみよう!';
});

function resetAll(){
  selectedColor = null;
  selectedFinish = null;
  colorPage = 0;
  partsPage = 0;
  selectedPartsIds.clear();
  document.getElementById('guideText').textContent = 'まずは気になる色の系統を選んでね!';
  showStep('stepColor');
}
document.getElementById('retryBtn').addEventListener('click', resetAll);
document.getElementById('retryBtn2').addEventListener('click', resetAll);
</script>
</body>
</html>
